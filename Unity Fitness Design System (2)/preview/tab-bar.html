<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><link rel="stylesheet" href="../colors_and_type.css"></head><body class="card" style="background:#F7F6FB">
<style>
  .tab { background:#fff;border-top:1px solid #D8D6EE;display:flex;padding:8px 0;justify-content:space-around;}
  .ti { display:flex;flex-direction:column;align-items:center;gap:4px;flex:1; }
  .cap { width:36px;height:36px;border-radius:18px;display:flex;align-items:center;justify-content:center;font:700 18px Inter; }
  .on .cap { background:#9f99c726; color:#3C0008; }
  .off .cap { color:#9f99c7; }
  .lab { font:600 11px Inter; }
  .on .lab { color:#3C0008; }
  .off .lab { color:#9f99c7; }
</style>
<div class="tab">
  <div class="ti on"><div class="cap">⌂</div><div class="lab">Home</div></div>
  <div class="ti off"><div class="cap">◎</div><div class="lab">Explore</div></div>
  <div class="ti off"><div class="cap">⚡</div><div class="lab">Plans</div></div>
  <div class="ti off"><div class="cap">◔</div><div class="lab">Profile</div></div>
</div>
<div style="font:400 12px Inter;color:#5C567A;margin-top:10px">Active icon sits in a primaryMuted capsule (36×36 radius-full); inactive is lavender on white.</div>
</body></html>
