<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><link rel="stylesheet" href="../colors_and_type.css"></head><body class="card" style="background:#F7F6FB">
<style>
  .toast { background:#1E8A4C;color:#fff;padding:12px 16px;border-radius:14px;font:600 13px Inter;display:flex;align-items:center;gap:8px;box-shadow:0 4px 12px rgba(0,0,0,.15);max-width:90% }
  .toast.err { background:#D93025; }
  .switch { width:44px;height:26px;background:#9f99c7;border-radius:13px;position:relative;display:inline-block;}
  .switch:after { content:"";position:absolute;top:3px;left:21px;width:20px;height:20px;border-radius:10px;background:#3C0008;}
  .switch.off { background:#D8D6EE; }
  .switch.off:after { left:3px; background:#fff; }
</style>
<div style="display:flex;flex-direction:column;gap:10px;margin-bottom:16px">
  <div class="toast">✓ Welcome to GymPass!</div>
  <div class="toast err">⚠ No account found with this email.</div>
</div>
<div style="display:flex;gap:24px;align-items:center;font:400 13px Inter;color:#5C567A">
  <div><div class="switch"></div> on</div>
  <div><div class="switch off"></div> off</div>
</div>
<div style="font:400 12px Inter;color:#5C567A;margin-top:12px">Toasts: success (green), error (red); both rounded 14, soft pop shadow. Switch track lavender / border; thumb burgundy / white.</div>
</body></html>
