<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><link rel="stylesheet" href="../colors_and_type.css"></head><body class="card" style="background:#F7F6FB">
<style>
  .row { display:grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .stat { background:#fff; border-radius:14px; padding:16px; box-shadow:0 2px 8px rgba(0,0,0,.08); display:flex;flex-direction:column;align-items:center;gap:4px }
  .icon { width:36px;height:36px;border-radius:18px;background:#3C000820;display:flex;align-items:center;justify-content:center;margin-bottom:4px;color:#3C0008;font-weight:700;font-family:Inter;font-size:14px; }
  .v { font:900 20px Inter; color:#1A1728; }
  .l { font:400 11px Inter; color:#A09CC0; }
  .pill { background:#fff;border:1px solid #D8D6EE;border-radius:14px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 2px 8px rgba(0,0,0,.08) }
  .pill .ic { color:#3C0008; font-size:18px; }
  .pill .lb { font:600 11px Inter; color:#1A1728; }
</style>
<div class="row">
  <div class="stat"><div class="icon">✦</div><div class="v">120</div><div class="l">Points</div></div>
  <div class="stat"><div class="icon">✓</div><div class="v">7</div><div class="l">Check-ins</div></div>
  <div class="pill"><div class="ic">⊞</div><div class="lb">Access<br>Any Gym</div></div>
  <div class="pill"><div class="ic">+</div><div class="lb">Buy Points</div></div>
</div>
</body></html>
