<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><link rel="stylesheet" href="../colors_and_type.css"></head><body class="card" style="background:#F7F6FB">
<style>
  .row { display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
  .chip { padding:8px 16px;border-radius:999px;background:#fff;border:1px solid #D8D6EE;font:500 13px Inter;color:#1A1728;box-shadow:0 2px 8px rgba(0,0,0,.08) }
  .chip.on { background:#3C0008;color:#fff;border-color:#3C0008; }
  .badge { display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;font:700 11px Inter;color:#fff;}
  .b1 { background:#9f99c7; } .b2 { background:#F59E0B; } .b3 { background:#3C0008; }
  .pts { display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;background:#fff;font:700 13px Inter;color:#3C0008;}
  .role { background:#fff;color:#9f99c7; }
</style>
<div class="row">
  <span class="chip on">All</span>
  <span class="chip">Tier 1</span>
  <span class="chip">Tier 2</span>
  <span class="chip">Tier 3</span>
</div>
<div style="font:400 12px Inter;color:#5C567A;margin-bottom:6px">Filter chips · pill, 1px border, on-state swaps to accent fill.</div>
<hr style="border:none;border-top:1px solid #D8D6EE;margin:14px 0;">
<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
  <span class="badge b1">Tier 1</span>
  <span class="badge b2">Tier 2</span>
  <span class="badge b3">Tier 3</span>
  <span class="pts">⚡ 120 pts</span>
  <span class="pts role">🛡 Member</span>
</div>
<div style="font:400 12px Inter;color:#5C567A;margin-top:10px">Tier badges (filled by tier color), points pill (white on color), role pill (white tinted).</div>
</body></html>
