<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><link rel="stylesheet" href="../colors_and_type.css"></head><body class="card" style="padding:0;background:#fff">
<style>
  body { font-family: Inter; }
  .grid { display:grid; grid-template-columns: 1.05fr 1fr 1.1fr; gap: 0; }
  .panel { padding: 18px 18px 16px; position:relative; border-right: 1px solid #ECEAF5; min-height: 230px; }
  .panel:last-child { border-right:none; }
  .h { font: 700 11px Inter; color:#3C0008; letter-spacing:1.4px; text-transform:uppercase; }
  .sub { font: 400 11px Inter; color:#A09CC0; margin-top:3px; margin-bottom:14px; }
  .num { position:absolute; top:14px; right:14px; font:900 10px Inter; color:#D8D6EE; letter-spacing:1px;}

  /* 01 Easing */
  .easing-stage { position:relative; height: 110px; }
  .easing-stage svg { width:100%; height:100%; overflow:visible; }
  .axis { stroke:#ECEAF5; stroke-width:1; }
  .curve { fill:none; stroke-width: 2; stroke-linecap:round; }
  .curve.a { stroke:#3C0008; }
  .curve.b { stroke:#9f99c7; stroke-dasharray: 4 4; }
  .ball { fill: #3C0008; }
  .legend { display:flex; gap:12px; font:500 10px Inter; color:#5C567A; margin-top:6px; align-items:center;}
  .legend i { display:inline-block; width:14px; height:2px; margin-right:5px; border-radius:1px; }

  /* 02 Loop — silky shimmer card, no arrow animation */
  .loop-stage { position:relative; height:110px; display:flex; align-items:center; justify-content:center; }
  .silky-card {
    width: 92%; height: 78px; border-radius: 16px;
    position: relative; overflow:hidden;
    background:
      radial-gradient(140% 100% at 0% 0%, #f3d6db 0%, transparent 55%),
      radial-gradient(140% 100% at 100% 100%, #6B0010 0%, transparent 60%),
      linear-gradient(125deg, #9f99c7 0%, #7a73a8 50%, #3C0008 100%);
    box-shadow: 0 10px 22px rgba(60,0,8,.28), inset 0 1px 0 rgba(255,255,255,.25);
  }
  .silky-card::before {
    content:""; position:absolute; inset:-30%;
    background: conic-gradient(from 200deg at 30% 60%, rgba(255,255,255,0) 0deg, rgba(255,255,255,.45) 30deg, rgba(255,255,255,0) 90deg, rgba(243,214,219,.35) 220deg, rgba(255,255,255,0) 360deg);
    filter: blur(14px); mix-blend-mode: screen; pointer-events:none;
  }
  .silky-card::after {
    content:""; position:absolute; top:0; bottom:0; width: 90px;
    background: linear-gradient(100deg, transparent 0%, rgba(255,255,255,.22) 50%, transparent 100%);
    transform: skewX(-20deg) translateX(-200px);
    animation: shim 2.5s linear infinite;
  }
  @keyframes shim { to { transform: skewX(-20deg) translateX(440px); } }
  .static-arrow {
    position:absolute; right:14px; top:50%; transform: translateY(-50%);
    width: 28px; height: 28px; border-radius: 14px; background: rgba(255,255,255,.18);
    border: 1px solid rgba(255,255,255,.25);
    display:flex; align-items:center; justify-content:center;
    color:#fff; font: 700 14px Inter;
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  }
  .meta-row { display:flex; justify-content:space-between; font:500 10px Inter; color:#5C567A; margin-top:8px; }
  .meta-row b { color:#1A1728; font-weight:700; }

  /* 03 Decorative blob — composed silk */
  .blob-stage {
    position:relative; height:110px; border-radius:16px; overflow:hidden;
    background:
      radial-gradient(120% 90% at 0% 0%, #f3d6db 0%, transparent 55%),
      radial-gradient(140% 100% at 100% 100%, #6B0010 0%, transparent 60%),
      linear-gradient(135deg, #9f99c7 0%, #cfc8e8 40%, #7a73a8 100%);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.18);
  }
  /* silk light leak */
  .blob-stage::before {
    content:""; position:absolute; inset:-20%;
    background: conic-gradient(from 180deg at 60% 40%, rgba(255,255,255,0) 0deg, rgba(255,255,255,.5) 25deg, rgba(255,255,255,0) 80deg, rgba(243,214,219,.35) 200deg, rgba(255,255,255,0) 360deg);
    filter: blur(18px); mix-blend-mode: screen;
  }
  /* crosshatch weave */
  .blob-stage::after {
    content:""; position:absolute; inset:0; pointer-events:none;
    background:
      repeating-linear-gradient( 24deg, rgba(255,255,255,.10) 0 1px, transparent 1px 7px),
      repeating-linear-gradient(-24deg, rgba(60,0,8,.12)     0 1px, transparent 1px 11px);
    mix-blend-mode: overlay;
  }
  .blob-stage > * { position:relative; z-index:1; }
  .b-large {
    position:absolute; top:-44px; right:-44px; width:140px; height:140px; border-radius:70px;
    background: radial-gradient(circle at 30% 30%, #6B0010 0%, #3C0008 60%, #1a0008 100%);
    box-shadow: inset -8px -10px 22px rgba(0,0,0,.45), inset 6px 8px 18px rgba(255,255,255,.18);
    opacity:.85;
  }
  .b-mid {
    position:absolute; top:-12px; right:6px; width:36px; height:36px; border-radius:18px;
    background: radial-gradient(circle at 30% 30%, #fff 0%, #f3d6db 70%);
    opacity:.85; box-shadow: 0 2px 6px rgba(60,0,8,.25);
  }
  .b-small {
    position:absolute; bottom:14px; left:18px; width:14px; height:14px; border-radius:7px;
    background: #fff; opacity:.7; box-shadow: 0 0 12px rgba(255,255,255,.6);
  }
  .crosshair { position:absolute; top:0; right:0; width:88px; height:88px; }
  .crosshair::before, .crosshair::after { content:""; position:absolute; background: rgba(255,255,255,.45); }
  .crosshair::before { left:0; right:0; top:44px; height:1px; }
  .crosshair::after  { top:0; bottom:0; left:44px; width:1px; }
  .coord { position:absolute; top:6px; right:8px; font:600 9px Inter; color:rgba(255,255,255,.9); letter-spacing:.3px; text-shadow: 0 1px 1px rgba(0,0,0,.3); }
  .tag {
    position:absolute; bottom:8px; right:10px;
    background: rgba(255,255,255,.18); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,.22);
    padding: 3px 8px; border-radius: 999px;
    font:600 9px Inter; color:#fff; letter-spacing:.5px;
  }
</style>

<div class="grid">
  <!-- 01 Easing -->
  <div class="panel">
    <div class="num">01</div>
    <div class="h">Easing</div>
    <div class="sub">Calm, declarative</div>
    <div class="easing-stage">
      <svg viewBox="0 0 200 100" preserveAspectRatio="none">
        <line class="axis" x1="0"  y1="100" x2="200" y2="100"/>
        <line class="axis" x1="0"  y1="0"   x2="0"   y2="100"/>
        <line class="axis" x1="0"  y1="50"  x2="200" y2="50"  stroke-dasharray="2 4"/>
        <path class="curve a" d="M0 100 C 30 30, 80 0, 200 0"/>
        <path class="curve b" d="M0 100 C 60 100, 140 0, 200 0"/>
        <circle class="ball" cx="200" cy="0" r="3.5"/>
      </svg>
    </div>
    <div class="legend"><span><i style="background:#3C0008"></i>out cubic · 600ms entrance</span></div>
    <div class="legend"><span><i style="background:repeating-linear-gradient(90deg,#9f99c7 0 4px,transparent 4px 8px);"></i>inOut ease · 300ms loop</span></div>
  </div>

  <!-- 02 Loop -->
  <div class="panel">
    <div class="num">02</div>
    <div class="h">Live Loops</div>
    <div class="sub">Shimmer · 2.5s linear</div>
    <div class="loop-stage">
      <div class="silky-card">
        <div class="static-arrow">→</div>
      </div>
    </div>
    <div class="meta-row"><span>Sweep</span><b>80px · −20°</b></div>
    <div class="meta-row"><span>Arrow</span><b>static · glass chip</b></div>
  </div>

  <!-- 03 Decorative blob -->
  <div class="panel">
    <div class="num">03</div>
    <div class="h">Decorative Blob</div>
    <div class="sub">Hero corner motif</div>
    <div class="blob-stage">
      <div class="crosshair"></div>
      <div class="b-large"></div>
      <div class="b-mid"></div>
      <div class="b-small"></div>
      <div class="coord">top:−40 · right:−40</div>
      <div class="tag">160px · accent @ 15%</div>
    </div>
    <div class="meta-row"><span>Hero</span><b>·</b><span>Avatar</span><b>·</b><span>Auth</span></div>
  </div>
</div>
</body></html>
