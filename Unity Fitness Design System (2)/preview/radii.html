<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><link rel="stylesheet" href="../colors_and_type.css"></head><body class="card">
<style>
  .row { display:grid; grid-template-columns: repeat(5, 1fr); gap: 10px; align-items:end; }
  .b { background:#fff; border:1px solid #D8D6EE; height: 56px; display:flex;align-items:center;justify-content:center;font:600 11px Inter;color:#5C567A; }
  .lbl { font:400 11px Inter; color:#A09CC0; margin-top:6px; text-align:center; }
</style>
<div class="row">
  <div><div class="b" style="border-radius:8px">8</div><div class="lbl">sm — chips, icon tiles</div></div>
  <div><div class="b" style="border-radius:14px">14</div><div class="lbl">md — inputs, cards</div></div>
  <div><div class="b" style="border-radius:22px">22</div><div class="lbl">lg — popular cards</div></div>
  <div><div class="b" style="border-radius:32px">32</div><div class="lbl">xl — hero, sheets</div></div>
  <div><div class="b" style="border-radius:999px">∞</div><div class="lbl">full — buttons, pills</div></div>
</div>
<div style="font:400 12px Inter;color:#5C567A;margin-top:14px">Buttons are <em>always</em> pill-shaped. Hero containers use the full 32px brand radius.</div>
</body></html>
