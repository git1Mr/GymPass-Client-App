<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><link rel="stylesheet" href="../colors_and_type.css"></head><body class="card" style="padding:0;background:#3C0008;overflow:hidden">
<style>
  body { font-family: Inter; }
  .stage {
    position:relative; padding: 26px 28px 24px;
    background:
      radial-gradient(120% 80% at 0% 0%, #6B0010 0%, transparent 55%),
      radial-gradient(140% 90% at 100% 100%, #9f99c7 0%, transparent 60%),
      linear-gradient(135deg, #3C0008 0%, #1a0008 60%, #2a1238 100%);
    overflow:hidden;
  }
  .stage::before {
    content:""; position:absolute; inset:-20%;
    background: conic-gradient(from 200deg at 60% 50%, rgba(255,220,200,0) 0deg, rgba(255,220,200,.20) 45deg, rgba(159,153,199,.25) 130deg, rgba(255,255,255,0) 240deg);
    filter: blur(30px); mix-blend-mode: screen; pointer-events:none;
  }
  .stage::after {
    content:""; position:absolute; inset:0;
    background:
      repeating-linear-gradient(28deg, rgba(255,255,255,.05) 0 1px, transparent 1px 8px),
      repeating-linear-gradient(-28deg, rgba(0,0,0,.10) 0 1px, transparent 1px 11px);
    mix-blend-mode: overlay; pointer-events:none;
  }
  .stage > * { position:relative; z-index:1; }

  .row { display:flex; align-items:center; gap:20px; flex-wrap:wrap; }

  .logo-card {
    display:flex; align-items:center; gap:14px;
    padding: 14px 18px;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.12);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border-radius: 18px;
  }
  .glyph { width:74px; height:74px; flex-shrink:0; filter: drop-shadow(0 6px 16px rgba(0,0,0,.4)); }
  .word-stack { display:flex; flex-direction:column; }
  .word { font:900 22px Inter; color:#fff; letter-spacing:4px; line-height:1; }
  .word .u { color:#f3d6db; }
  .tag { font:400 10px Inter; color:rgba(255,255,255,.65); margin-top:6px;
         padding-left: 14px; letter-spacing:.3px;}

  .small-lockup {
    display:flex; align-items:center; gap:8px;
    background: rgba(255,255,255,.96); padding: 8px 14px; border-radius: 12px;
    box-shadow: 0 4px 12px rgba(0,0,0,.30);
  }
  .small-lockup svg { width:32px; height:32px; }
  .small-lockup .w { font:900 14px Inter; color:#1A1728; letter-spacing:2.5px; }
  .small-lockup .u { color:#3C0008; }

  .reverse {
    display:flex; align-items:center; gap:10px;
    padding: 10px 14px;
    border-radius: 12px;
    background: rgba(243,214,219,.12);
    border: 1px solid rgba(243,214,219,.25);
  }
  .reverse .circle {
    width:46px;height:46px;border-radius:23px;background:#F7F6FB;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
  }
  .reverse .circle svg { width:38px;height:38px; }
  .reverse .label { font:600 10px Inter; color:rgba(255,255,255,.75); letter-spacing:.5px;}

  .note { padding:12px 24px; font:400 11px Inter; color:rgba(255,255,255,.55); background: rgba(0,0,0,.2);}
</style>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="ufGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#E8723F"/>
      <stop offset="50%" stop-color="#5E5070"/>
      <stop offset="100%" stop-color="#2C7A86"/>
    </linearGradient>
    <linearGradient id="ufGradInner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#fff" stop-opacity=".25"/>
      <stop offset="60%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="ufHalo" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fff" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <symbol id="uMark" viewBox="0 0 100 100">
    <!-- soft halo -->
    <circle cx="50" cy="50" r="48" fill="url(#ufHalo)"/>
    <!-- outer ribbon U: angular tops, rounded bottom, hollow center -->
    <path d="M16 12
             L16 58
             Q16 86 50 86
             Q84 86 84 58
             L84 12
             L70 12
             L70 58
             Q70 72 50 72
             Q30 72 30 58
             L30 12 Z"
          fill="url(#ufGrad)"/>
    <!-- gloss overlay on outer ribbon -->
    <path d="M16 12 L16 58 Q16 86 50 86 Q84 86 84 58 L84 12 L70 12 L70 58 Q70 72 50 72 Q30 72 30 58 L30 12 Z"
          fill="url(#ufGradInner)"/>
    <!-- spark -->
    <circle cx="80" cy="14" r="2.4" fill="#f3d6db"/>
  </symbol>
</svg>

<div class="stage">
  <div class="row">
    <div class="logo-card">
      <svg class="glyph" viewBox="0 0 100 100"><use href="#uMark"/></svg>
      <div class="word-stack">
        <div class="word"><span class="u">U</span>NITY&nbsp;FITNESS</div>
        <div class="tag">Train anywhere, pay for what you use</div>
      </div>
    </div>
    <div class="small-lockup">
      <svg viewBox="0 0 100 100"><use href="#uMark"/></svg>
      <div class="w"><span class="u">U</span>NITYFITNESS</div>
    </div>
    <div class="reverse">
      <div class="circle"><svg viewBox="0 0 100 100"><use href="#uMark"/></svg></div>
      <div class="label">auth header<br>circle</div>
    </div>
  </div>
</div>
<div class="note">Custom U glyph · teal→plum→orange gradient (matched to source) · climbing-figures arrow nested inside the U · gloss highlight + soft halo + spark.</div>
</body></html>
