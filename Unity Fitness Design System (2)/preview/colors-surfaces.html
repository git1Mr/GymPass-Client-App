<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><link rel="stylesheet" href="../colors_and_type.css"></head><body class="card">
<style>
  table { width:100%; border-collapse: collapse; }
  td { padding: 6px 0; vertical-align: middle; border-bottom: 1px solid var(--uf-border); }
  td:last-child { text-align: right; color: var(--uf-text-muted); font-size: 12px; font-family: var(--uf-font-body); }
  .swatch { display:inline-block; width: 60px; height: 24px; border-radius: 6px; vertical-align: middle; margin-right: 12px; border: 1px solid rgba(0,0,0,.06); }
  .name { font-size: 13px; font-weight: 600; }
</style>
<table>
  <tr><td><span class="swatch" style="background:#F7F6FB"></span><span class="name">Background</span></td><td>#F7F6FB</td></tr>
  <tr><td><span class="swatch" style="background:#FFFFFF"></span><span class="name">Surface</span></td><td>#FFFFFF</td></tr>
  <tr><td><span class="swatch" style="background:#EEEDF7"></span><span class="name">Surface Elevated</span></td><td>#EEEDF7</td></tr>
  <tr><td><span class="swatch" style="background:#D8D6EE"></span><span class="name">Border</span></td><td>#D8D6EE</td></tr>
  <tr><td><span class="swatch" style="background:#1A1728"></span><span class="name">Text</span></td><td>#1A1728</td></tr>
  <tr><td><span class="swatch" style="background:#5C567A"></span><span class="name">Text Secondary</span></td><td>#5C567A</td></tr>
  <tr><td><span class="swatch" style="background:#A09CC0"></span><span class="name">Text Muted</span></td><td>#A09CC0</td></tr>
</table>
</body></html>
