<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><link rel="stylesheet" href="../colors_and_type.css"></head><body class="card" style="background:#F7F6FB">
<style>
  .silk {
    position:relative; border-radius:22px; padding:20px;
    overflow:hidden; isolation:isolate;
    background:
      radial-gradient(120% 90% at 0% 0%, rgba(243,214,219,.95) 0%, rgba(243,214,219,0) 55%),
      radial-gradient(140% 90% at 100% 100%, rgba(159,153,199,.55) 0%, rgba(159,153,199,0) 60%),
      linear-gradient(135deg, #fbeef1 0%, #f0eaf6 50%, #e9def0 100%);
    box-shadow: 0 8px 24px rgba(60,0,8,.10), inset 0 0 0 1px rgba(255,255,255,.6);
  }
  .silk::before {
    content:""; position:absolute; inset:-20%; pointer-events:none; z-index:0;
    background:
      repeating-linear-gradient( 24deg, rgba(255,255,255,.45) 0 1px, transparent 1px 7px),
      repeating-linear-gradient(-24deg, rgba(60,0,8,.06)     0 1px, transparent 1px 11px);
    mix-blend-mode: soft-light;
    filter: blur(.3px);
  }
  .silk::after {
    content:""; position:absolute; inset:-10% -30%; pointer-events:none; z-index:0;
    background: conic-gradient(from 200deg at 70% 30%, rgba(255,255,255,0) 0%, rgba(255,255,255,.55) 12%, rgba(255,255,255,0) 28%, rgba(243,214,219,.4) 50%, rgba(159,153,199,.0) 100%);
    filter: blur(20px);
    mix-blend-mode: screen;
  }
  .silk > * { position:relative; z-index:1; }
  .pop { position:absolute; top:-12px; right:18px; background:#3C0008; color:#fff; border-radius:999px; padding:5px 11px; font:700 11px Inter; letter-spacing:.4px; box-shadow:0 4px 10px rgba(60,0,8,.4); z-index:2;}
  .top { display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;gap:14px; }
  .name { font:900 22px Inter; color:#1A1728; letter-spacing:-.3px;}
  .desc { font:400 12px Inter; color:#5C567A; max-width:200px; margin-top:3px;}
  .price { background:rgba(60,0,8,.92); color:#fff; border-radius:14px; padding:10px 14px; text-align:center; min-width:64px; box-shadow: inset 0 1px 0 rgba(255,255,255,.18); }
  .amt { font:900 24px Inter; line-height:1;}
  .cur { font:600 10px Inter; opacity:.85; margin-top:3px; letter-spacing:1px;}
  .meta { font:600 12px Inter;color:#3C0008;margin-bottom:12px; display:flex; gap:6px; align-items:center;}
  .perk { font:400 13px Inter;color:#1A1728;display:flex;gap:8px;align-items:center;margin-bottom:5px; }
  .perk:before { content:""; width:14px;height:14px;border-radius:7px; background:#3C0008; mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='3' stroke-linecap='round'><path d='M5 12.5l5 5 9-11'/></svg>") center/65% no-repeat; -webkit-mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='3' stroke-linecap='round'><path d='M5 12.5l5 5 9-11'/></svg>") center/65% no-repeat;}
</style>
<div class="silk">
  <div class="pop">Most Popular</div>
  <div class="top">
    <div><div class="name">Mobility</div><div class="desc">Our most popular pack for regular city-hoppers.</div></div>
    <div class="price"><div class="amt">199</div><div class="cur">MAD</div></div>
  </div>
  <div class="meta">⚡ 25 pts · 7.96 MAD/pt</div>
  <div class="perk">25 points included</div>
  <div class="perk">Tier 1 &amp; 2 gyms</div>
  <div class="perk">Priority support</div>
</div>
</body></html>
