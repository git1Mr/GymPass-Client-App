<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><link rel="stylesheet" href="../colors_and_type.css"></head><body class="card">
<style>
  .row { display:flex; align-items:flex-end; gap: 10px; }

  .lbl { font: 400 11px Inter; color:#A09CC0; margin-top:6px; text-align:center }

</style>
<div class="row">
  <div class="c"><div class="b" style="width:4px;height:32px"></div><div class="lbl">xs<br>4</div></div>

  <div class="c"><div class="b" style="width:24px;height:32px"></div><div class="lbl">lg<br>24</div></div>
  <div class="c"><div class="b" style="width:32px;height:32px"></div><div class="lbl">xl<br>32</div></div>
  <div class="c"><div class="b" style="width:48px;height:32px"></div><div class="lbl">xxl<br>48</div></div>
  <div class="c"><div class="b" style="width:64px;height:32px"></div><div class="lbl">xxxl<br>64</div></div>
</div>
<div style="font:400 12px Inter;color:#5C567A;margin-top:14px">Strict 4px grid · used as <code>SPACING.lg</code> etc throughout RN styles.</div>
</body></html>
