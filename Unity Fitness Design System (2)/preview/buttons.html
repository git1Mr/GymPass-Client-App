<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><link rel="stylesheet" href="../colors_and_type.css"></head><body class="card">
<style>
  .stack { display:flex; flex-direction:column; gap: 12px; align-items:flex-start }
  .btn { display:inline-flex; align-items:center; gap:6px; padding: 12px 20px; border-radius: 999px; font: 700 15px Inter; cursor:pointer; border:none; }
  .pri { background:#3C0008; color:#fff; box-shadow: 0 4px 12px rgba(159,153,199,0.18); }
  .sec { background:#fff; color:#1A1728; border: 1.5px solid #D8D6EE; }
  .ghost { background:transparent; color:#3C0008; padding: 8px 14px; }
  .dis { background:#3C0008; color:#fff; opacity: .45; }
  .arrow { font-size: 14px; }
  .lbl { font:400 11px Inter; color:#A09CC0; }
</style>
<div class="stack">
  <div><button class="btn pri">Sign In <span class="arrow">→</span></button> <span class="lbl">Primary · accent fill · pill</span></div>
  <div><button class="btn sec">Close</button> <span class="lbl">Secondary · 1.5px border</span></div>
  <div><button class="btn ghost">Forgot password?</button> <span class="lbl">Ghost / link · accent text</span></div>
  <div><button class="btn dis">Sign In</button> <span class="lbl">Disabled · opacity 0.45</span></div>
</div>
</body></html>
