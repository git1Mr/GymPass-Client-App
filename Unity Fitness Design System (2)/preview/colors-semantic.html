<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><link rel="stylesheet" href="../colors_and_type.css"></head><body class="card">
<style>
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .chip { padding: 12px; border-radius: 14px; border: 1px solid var(--uf-border); display:flex; flex-direction:column; gap:4px; }
  .dot { width: 16px; height: 16px; border-radius: 999px; }
  .name { font-size: 13px; font-weight: 600; }
  .hex { font-size: 11px; color: var(--uf-text-muted); }
</style>
<div class="row">
  <div class="chip" style="background:#FFE9E8;border-color:#F2C7C4"><div class="dot" style="background:#D93025"></div><div class="name">Error</div><div class="hex">#D93025 · bg #FFE9E8</div></div>
  <div class="chip" style="background:#E6F4EA;border-color:#BFE2CD"><div class="dot" style="background:#1E8A4C"></div><div class="name">Success</div><div class="hex">#1E8A4C</div></div>
  <div class="chip" style="background:#FFF4E0;border-color:#F1D6A2"><div class="dot" style="background:#F59E0B"></div><div class="name">Warning</div><div class="hex">#F59E0B</div></div>
  <div class="chip" style="background:#9f99c726;border-color:#D8D6EE"><div class="dot" style="background:#9f99c7"></div><div class="name">Tier 1 · Standard</div><div class="hex">primary lavender</div></div>
  <div class="chip" style="background:#FFF4E0;border-color:#F1D6A2"><div class="dot" style="background:#F59E0B"></div><div class="name">Tier 2 · Mobility</div><div class="hex">warning amber</div></div>
  <div class="chip" style="background:#3C000820;border-color:#D8D6EE"><div class="dot" style="background:#3C0008"></div><div class="name">Tier 3 · Elite</div><div class="hex">accent burgundy</div></div>
</div>
</body></html>
