worker_processes  auto;
events { worker_connections 1024; }

http {
  upstream auth_upstream   { server auth-service:3001; }
  upstream wallet_upstream { server wallet-service:3002; }
  upstream qr_upstream     { server qr-security-service:3003; }
  upstream settle_upstream { server settlement-engine:3004; }

  # Credentialed CORS requires echoing a specific Origin (never "*"). Only
  # whitelisted origins are reflected; anything else gets an empty header and
  # is blocked by the browser. Add/replace the prod domains as needed.
  map $http_origin $cors_origin {
    default                                  "";
    "~^https?://localhost:3000$"             $http_origin;  # dashboard (dev)
    "~^https?://localhost:5173$"             $http_origin;  # landing (dev)
    "~^https?://127\.0\.0\.1:(3000|5173)$"   $http_origin;  # dev (loopback)
    "~^https://unityfitness\.ma$"            $http_origin;  # landing (prod)
    "~^https://app\.unityfitness\.ma$"       $http_origin;  # dashboard (prod)
  }

  client_max_body_size 10m;
  proxy_http_version 1.1;
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 60s;

  access_log /dev/stdout;
  error_log  /dev/stderr warn;

  server {
    listen 8080;
    server_name _;

    # CORS — credentialed, so the dashboard/landing can send & receive the
    # cross-subdomain session cookies. Only whitelisted origins (see the
    # $cors_origin map above) are reflected; credentials must never pair with
    # a "*" origin. Native (Expo) clients don't enforce CORS, so they're fine.
    add_header 'Access-Control-Allow-Origin'      $cors_origin always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;
    add_header 'Vary'                             'Origin' always;
    add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers'     'Content-Type, x-auth-token, Authorization, stripe-signature, Accept, Origin' always;
    add_header 'Access-Control-Expose-Headers'    'x-auth-token, Content-Length, Content-Range' always;
    add_header 'Access-Control-Max-Age'           '86400' always;

    # Short-circuit CORS preflight for any OPTIONS request before it reaches
    # an upstream — saves a round-trip and avoids services needing CORS too.
    if ($request_method = OPTIONS) { return 204; }

    location = /health {
      add_header Content-Type application/json;
      return 200 '{"ok":true,"service":"gateway"}';
    }

    # auth-service ─────────────────────────────────────────────────
    location /api/auth  { proxy_pass http://auth_upstream; }
    location /api/users { proxy_pass http://auth_upstream; }

    # qr-security-service ──────────────────────────────────────────
    location /api/gym-access { proxy_pass http://qr_upstream; }

    # settlement-engine ────────────────────────────────────────────
    location /api/settlements { proxy_pass http://settle_upstream; }

    # wallet-service — Stripe webhook MUST come first (exact match)
    location = /api/payments/webhook {
      proxy_pass http://wallet_upstream;
      proxy_request_buffering off;
    }
    location /api/gyms          { proxy_pass http://wallet_upstream; }
    location /api/transactions  { proxy_pass http://wallet_upstream; }
    location /api/points-config { proxy_pass http://wallet_upstream; }
    location /api/withdrawals   { proxy_pass http://wallet_upstream; }
    location /api/tier-requests { proxy_pass http://wallet_upstream; }
    location /api/payments      { proxy_pass http://wallet_upstream; }

    location / {
      add_header Content-Type application/json;
      return 404 '{"error":"Not found. Check /health or /api/*."}';
    }
  }
}
